{{define "terminal_header"}}
<header class="bg-slate-900 border-b border-slate-800 text-white px-6 py-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
        <!-- Logo & Title -->
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center font-black text-xl shadow-inner text-white">
                U
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <span class="font-bold text-lg tracking-tight">UniCard Terminal</span>
                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full {{if eq .Mode "retail"}}bg-emerald-500/20 text-emerald-300 border border-emerald-500/30{{else}}bg-blue-500/20 text-blue-300 border border-blue-500/30{{end}}">
                        {{if eq .Mode "retail"}}Retail POS{{else}}Transit Validator{{end}}
                    </span>
                </div>
                <p class="text-xs text-slate-400">Closed-Loop Contactless Tap Engine</p>
            </div>
        </div>

        <!-- Mode Switcher Nav -->
        <div class="flex items-center bg-slate-800/80 p-1 rounded-xl border border-slate-700">
            <a href="/terminal/retail" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-2 {{if eq .Mode "retail"}}bg-indigo-600 text-white shadow{{else}}text-slate-400 hover:text-white{{end}}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span>Retail POS</span>
            </a>
            <a href="/terminal/transport" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-2 {{if eq .Mode "transport"}}bg-indigo-600 text-white shadow{{else}}text-slate-400 hover:text-white{{end}}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                <span>Transit Validator</span>
            </a>
            <a href="/refund" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-2 {{if eq .Mode "refund"}}bg-rose-600 text-white shadow{{else}}text-slate-400 hover:text-rose-300{{end}}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 15v-1a4 4 0 00-4-4H8m0 0l3 3m-3-3l3-3m9 14V5a2 2 0 00-2-2H6a2 2 0 00-2 2v16l4-2 4 2 4-2 4 2z"/></svg>
                <span>Manager Refund</span>
            </a>
        </div>


        <!-- System Status & Clock -->
        <div class="flex items-center space-x-4 text-xs">
            <div class="flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700/60">
                <span id="mqttStatusDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="mqttStatusText" class="text-slate-300 font-medium">Reader Ready</span>
            </div>
            <div id="liveClock" class="font-mono text-slate-400 hidden sm:block">--:--:--</div>
        </div>
    </div>
</header>
{{end}}
