{{define "transport_fare_modal"}}
<div id="fareConfigModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-150">
        <div class="flex justify-between items-center pb-3 border-b border-slate-100">
            <div>
                <h3 class="font-bold text-slate-800 text-base">Configure Dynamic Fares</h3>
                <p class="text-xs text-slate-400">Merchant distance rate settings</p>
            </div>
            <button type="button" onclick="transitTerminal.toggleFareConfigModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">
                ✕
            </button>
        </div>

        <form id="fareConfigForm" onsubmit="transitTerminal.saveFareConfig(event)" class="space-y-4 my-4 text-xs">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Base Fare (₱)</label>
                    <input type="number" id="inputBaseFare" step="0.50" min="1" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Base Distance (km)</label>
                    <input type="number" id="inputBaseKm" step="0.5" min="1" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Rate per Additional Km (₱)</label>
                <input type="number" id="inputPerKmRate" step="0.25" min="0" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <!-- Promotion Section -->
            <div class="p-3 bg-amber-50/70 border border-amber-200/60 rounded-2xl space-y-3">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-amber-900">Merchant Special Promotion</span>
                    <input type="checkbox" id="inputIsPromoActive" class="w-4 h-4 text-amber-600 rounded">
                </div>
                <div>
                    <label class="block font-semibold text-amber-800 mb-1">Promo Discount (%)</label>
                    <input type="number" id="inputPromoPercent" step="1" min="0" max="100" class="w-full px-3 py-1.5 border border-amber-300 rounded-xl bg-white outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-amber-800 mb-1">Promotion Name</label>
                    <input type="text" id="inputPromoName" placeholder="e.g. Summer Route Promo" class="w-full px-3 py-1.5 border border-amber-300 rounded-xl bg-white outline-none">
                </div>
            </div>

            <div class="pt-2 flex space-x-2">
                <button type="button" onclick="transitTerminal.toggleFareConfigModal()" class="w-1/2 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">
                    Cancel
                </button>
                <button type="submit" class="w-1/2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition">
                    Save Rates
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
