{{define "retail_catalog"}}
<div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 flex flex-col h-full">
    <div class="flex items-center justify-between mb-4">
        <div>
            <h2 class="font-bold text-slate-800 text-base">Quick Catalog & Keypad</h2>
            <p class="text-xs text-slate-400">Tap items or type custom price to add to cart</p>
        </div>
        <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg">POS Items</span>
    </div>

    <!-- Quick Item Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5" id="catalogGrid">
        <button type="button" onclick="posCart.addItem('Bottled Water (500ml)', 20.00)" class="p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition active:scale-95 group">
            <div class="text-xl mb-1">💧</div>
            <div class="font-semibold text-xs text-slate-800 group-hover:text-indigo-600 truncate">Bottled Water</div>
            <div class="text-xs font-bold text-indigo-600 mt-0.5">₱20.00</div>
        </button>
        <button type="button" onclick="posCart.addItem('Instant Coffee', 25.00)" class="p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition active:scale-95 group">
            <div class="text-xl mb-1">☕</div>
            <div class="font-semibold text-xs text-slate-800 group-hover:text-indigo-600 truncate">Instant Coffee</div>
            <div class="text-xs font-bold text-indigo-600 mt-0.5">₱25.00</div>
        </button>
        <button type="button" onclick="posCart.addItem('Baked Bread / Roll', 35.00)" class="p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition active:scale-95 group">
            <div class="text-xl mb-1">🍞</div>
            <div class="font-semibold text-xs text-slate-800 group-hover:text-indigo-600 truncate">Baked Bread</div>
            <div class="text-xs font-bold text-indigo-600 mt-0.5">₱35.00</div>
        </button>
        <button type="button" onclick="posCart.addItem('Snack Chips', 45.00)" class="p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition active:scale-95 group">
            <div class="text-xl mb-1">🥔</div>
            <div class="font-semibold text-xs text-slate-800 group-hover:text-indigo-600 truncate">Snack Chips</div>
            <div class="text-xs font-bold text-indigo-600 mt-0.5">₱45.00</div>
        </button>
        <button type="button" onclick="posCart.addItem('Sandwich / Meal', 85.00)" class="p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition active:scale-95 group">
            <div class="text-xl mb-1">🥪</div>
            <div class="font-semibold text-xs text-slate-800 group-hover:text-indigo-600 truncate">Sandwich Meal</div>
            <div class="text-xs font-bold text-indigo-600 mt-0.5">₱85.00</div>
        </button>
        <button type="button" onclick="posCart.addItem('Student Notebook', 38.00)" class="p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition active:scale-95 group">
            <div class="text-xl mb-1">📓</div>
            <div class="font-semibold text-xs text-slate-800 group-hover:text-indigo-600 truncate">Notebook</div>
            <div class="text-xs font-bold text-indigo-600 mt-0.5">₱38.00</div>
        </button>
    </div>

    <!-- Custom Item Form -->
    <div class="mt-auto border-t border-slate-100 pt-4">
        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Add Custom Product</h3>
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
            <input type="text" id="customItemName" placeholder="Item description" class="sm:col-span-6 px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            <div class="sm:col-span-4 relative">
                <span class="absolute left-3 top-2 text-xs text-slate-400 font-bold">₱</span>
                <input type="number" id="customItemPrice" step="0.01" min="0.01" placeholder="0.00" class="w-full pl-7 pr-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-medium">
            </div>
            <button type="button" onclick="posCart.addCustomItem()" class="sm:col-span-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2 px-3 rounded-xl transition flex items-center justify-center">
                + Add
            </button>
        </div>
    </div>
</div>
{{end}}
