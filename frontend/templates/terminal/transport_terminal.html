<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - UniCard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Modular Header Component -->
    {{template "terminal_header" .}}

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
        <!-- Terminal & Merchant Bar -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center space-x-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Transit Operator:</label>
                    <select id="selectMerchant" onchange="transitTerminal.onMerchantChange()" class="text-xs font-semibold bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        {{range .Merchants}}
                        <option value="{{.ID}}">{{.Name}}</option>
                        {{else}}
                        <option value="" disabled selected>No active transit merchants found</option>
                        {{end}}
                    </select>
                </div>

                <div class="flex items-center space-x-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Validator Device:</label>
                    <select id="selectTerminal" onchange="transitTerminal.onTerminalChange()" class="text-xs font-mono font-semibold bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="" disabled selected>-- Select Validator --</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center space-x-2 text-xs">
                <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                <span id="activeTerminalLabel" class="font-medium text-slate-300">Ready</span>
            </div>
        </div>

        <!-- Grid Layout: Left Control Panel & Right Passenger Display -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-stretch">
            <!-- Left Column: Route Selector & Dynamic Fare Setting -->
            <div class="lg:col-span-5 h-full">
                {{template "transport_route_selector" .}}
            </div>

            <!-- Right Column: Passenger Transit Screen -->
            <div class="lg:col-span-7 h-full">
                {{template "transport_display" .}}
            </div>
        </div>
    </main>

    <!-- Modular Dynamic Fare Settings Modal -->
    {{template "transport_fare_modal" .}}

    <!-- Inject Server State -->
    <script>
        window.transitMerchants = {{.MerchantsJSON}};
    </script>
    <!-- MQTT WebSocket Client -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Transit Terminal Controller Script -->
    <script src="/assets/js/transport_terminal.js"></script>
</body>
</html>
