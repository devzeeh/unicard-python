<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - UniCard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100/70 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Modular Header Component -->
    {{template "terminal_header" .}}

    <!-- Main POS Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
        <!-- Terminal & Merchant Selector Bar -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center space-x-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Merchant:</label>
                    <select id="selectMerchant" onchange="posCart.onMerchantChange()" class="text-xs font-semibold bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        {{range .Merchants}}
                        <option value="{{.ID}}">{{.Name}}</option>
                        {{else}}
                        <option value="" disabled selected>No active merchants found</option>
                        {{end}}
                    </select>
                </div>

                <div class="flex items-center space-x-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Terminal:</label>
                    <select id="selectTerminal" onchange="posCart.onTerminalChange()" class="text-xs font-mono font-semibold bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="" disabled selected>-- Select Terminal --</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center space-x-2 text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span id="activeTerminalLabel" class="font-medium text-slate-600">Checking terminal...</span>
            </div>
        </div>

        <!-- Two Column POS Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
            <!-- Left Column: Modular Catalog & Keypad -->
            <div class="lg:col-span-7 h-full">
                {{template "retail_catalog" .}}
            </div>

            <!-- Right Column: Modular Cart & Tap Checkout -->
            <div class="lg:col-span-5 h-full">
                {{template "retail_cart" .}}
            </div>
        </div>
    </main>

    <!-- Modular Receipt Modal Component -->
    {{template "retail_receipt_modal" .}}

    <!-- Inject Server State -->
    <script>
        window.posMerchants = {{.MerchantsJSON}};
    </script>
    <!-- MQTT WebSocket Client -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- POS Controller Script -->
    <script src="/assets/js/retail_pos.js"></script>
</body>
</html>
